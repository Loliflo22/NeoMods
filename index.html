<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeoMods – Mods und Plugins für NeoLegacy</title>
  <meta name="description" content="Der Hub für Mods und Plugins für NeoLegacy. Suchen, nach Version filtern und herunterladen.">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#app">Zum Inhalt springen</a>

  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="#/" aria-label="NeoMods, Startseite">
        <img src="assets/logo.svg" alt="" width="36" height="36">
        <span>NeoMods</span>
      </a>
      <nav class="nav" aria-label="Hauptmenü">
        <a href="#/" data-nav="home">Entdecken</a>
        <a href="#/einreichen" data-nav="submit">Einreichen</a>
        <a href="https://github.com/pieeebot/neoLegacy" target="_blank" rel="noopener noreferrer" id="projectLink">NeoLegacy</a>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1">
    <noscript><p class="notice">NeoMods braucht JavaScript, um die Mods anzuzeigen.</p></noscript>
    <p class="notice">Lade Mods …</p>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p>NeoMods ist ein Community-Projekt und nicht mit Mojang, Microsoft oder dem NeoLegacy-Team verbunden.</p>
      <p>Downloads stammen von den jeweiligen Autoren. Prüfe Dateien, bevor du sie installierst.</p>
    </div>
  </footer>

  <dialog id="lightbox" aria-label="Bildansicht">
    <button class="lb-close" type="button" aria-label="Schließen">Schließen</button>
    <img alt="">
  </dialog>

  <script src="assets/app.js"></script>
</body>
</html>
